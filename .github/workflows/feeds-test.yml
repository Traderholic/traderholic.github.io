name: Feeds test
on:
  workflow_dispatch:
    inputs:
      kw: { description: 'Keyword regex', required: false }
      q: { description: 'Search query', required: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/feeds-test.mjs
        env: { KW: '${{ inputs.kw }}', Q: '${{ inputs.q }}' }
