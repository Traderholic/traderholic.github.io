name: dbg
on: push
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in '"close","update_mode","market_status","is_trading","lp_time","change"' '"close","update_mode"' ; do
          curl -s -X POST https://scanner.tradingview.com/global/scan -H 'Content-Type: application/json' -H 'Origin: https://www.tradingview.com' -d '{"symbols":{"tickers":["OANDA:XAUUSD","FX:EURUSD","TVC:SILVER","NASDAQ:AAPL"]},"columns":['"$f"']}'; echo; done
          date -u
