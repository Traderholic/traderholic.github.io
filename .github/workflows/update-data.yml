name: Update market data

# One long-lived job watches the calendar and news and pushes changes immediately.
# Each job watches for 5.5 hours (longer if a release is due, never handing over mid-release).
# The hourly schedule keeps one job queued behind it, so the next one starts the moment the
# current one ends; a running job is never cancelled. New script code is picked up by the
# watcher itself (it restarts in-process), so pushes to scripts/ need no new job.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Watch calendar and news
        env:
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/update.mjs --watch
