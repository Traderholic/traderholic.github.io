name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=$(date -u -d '-2 day' +%Y-%m-%dT00:00:00.000Z); T=$(date -u -d '+1 day' +%Y-%m-%dT00:00:00.000Z)
          echo "== TV"; curl -s -m 20 -H 'Origin: https://www.tradingview.com' -H 'Referer: https://www.tradingview.com/' -A 'Mozilla/5.0' "https://economic-calendar.tradingview.com/events?from=$F&to=$T&countries=US,EU,GB,JP,CN" | jq -c '.result[]|select(.importance>=0)|[.date,.currency,.importance,.title,.actual,.forecast,.previous,.unit,.scale]' | head -120
