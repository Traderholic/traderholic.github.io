name: probe
on:
  push:
    branches: [test-summary]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          Q='Warsh%20says%20emerging%20technologies%20will%20have%20significant%20impact'
          echo "== gtx"; curl -s -w ' [%{http_code}]\n' -m 15 -A 'Mozilla/5.0' "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=$Q" | head -c 400; echo
          echo "== gtx2"; curl -s -w ' [%{http_code}]\n' -m 15 -A 'Mozilla/5.0' "https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=ar&dt=t&q=$Q" | head -c 400; echo
          echo "== clients5"; curl -s -w ' [%{http_code}]\n' -m 15 -A 'Mozilla/5.0' "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ar&q=$Q" | head -c 400; echo
          echo "== mymemory"; curl -s -w ' [%{http_code}]\n' -m 15 "https://api.mymemory.translated.net/get?q=$Q&langpair=en|ar" | head -c 500; echo
