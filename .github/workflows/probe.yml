name: probe
on:
  push:
    branches: [test-summary]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: |
          node scripts/update.mjs --summary-test "2026-11-16T17:00:00.000Z|USD|Fed Chairman Warsh Speaks"
          node scripts/update.mjs --summary-test "2026-11-16T15:30:00.000Z|USD|Empire State Manufacturing Index"
