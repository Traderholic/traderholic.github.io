name: probe
on:
  push:
    branches: [dbg3]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in 'الذهب الأونصة' 'بيتكوين' 'وول ستريت الأسهم الأمريكية'; do
            U=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$q")
            echo "== $q"; curl -s -m 20 -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/126.0' "https://www.bing.com/news/search?q=$U&format=rss&setlang=ar&cc=SA&qft=sortbydate%3d%221%22" | python3 -c "
          import sys,re,html
          x=sys.stdin.read()
          for it in re.findall(r'<item>(.*?)</item>',x,re.S)[:8]:
            g=lambda t:(re.search(r'<'+t+r'>(.*?)</'+t+'>',it,re.S) or [None,''])[1]
            print(g('pubDate'),'|',g('News:Source'),'|',html.unescape(g('title'))[:90])"
          done
