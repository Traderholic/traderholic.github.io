name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          F=$(date -u -d '-2 day' +%Y-%m-%dT00:00:00.000Z); T=$(date -u -d '+1 day' +%Y-%m-%dT00:00:00.000Z)
          echo "== TV"; curl -s -m 20 -H 'Origin: https://www.tradingview.com' -H 'Referer: https://www.tradingview.com/' -A 'Mozilla/5.0' "https://economic-calendar.tradingview.com/events?from=$F&to=$T&countries=US,EU,GB,JP,CN" | head -c 3000; echo
          echo "== FF json"; curl -s -m 20 -A 'Mozilla/5.0' https://nfs.faireconomy.media/ff_calendar_thisweek.json | head -c 600; echo
          echo "== FF html"; curl -s -o /dev/null -w '%{http_code}\n' -m 20 -A 'Mozilla/5.0 (X11; Linux x86_64) Chrome/126' https://www.forexfactory.com/calendar
